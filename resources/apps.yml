# Both apps are deployed and started by `bundle deploy`. The setup job then loads the
# release into the Steward queue and redeploys the explainer with this workspace's evidence.
resources:
  apps:
    steward:
      name: identity-steward
      description: Guest identity review queue with a review agent
      source_code_path: ../apps/steward
      lifecycle:
        started: true
      resources:
        - name: postgres
          postgres:
            branch: ${resources.postgres_projects.steward_db.name}/branches/production
            database: ${resources.postgres_projects.steward_db.name}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: experiment
          experiment:
            experiment_id: ${resources.experiments.review_agent_experiment.id}
            permission: CAN_EDIT
      config:
        command: ['python', 'api.py']
        env:
          # PGHOST, PGDATABASE and PGUSER are injected from the postgres resource.
          - name: LAKEBASE_ENDPOINT
            value: ${resources.postgres_projects.steward_db.name}/branches/production/endpoints/primary
          - name: REVIEW_MODEL
            value: ${var.catalog}.steward_ai.review_agent
          - name: MLFLOW_EXPERIMENT_ID
            value_from: experiment

    presenter:
      name: identity-presenter
      description: Identity resolution explainer (read-only release evidence)
      source_code_path: ../apps/identity-presenter
      lifecycle:
        started: true
