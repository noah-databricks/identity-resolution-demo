<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guest identities</title><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/guest-editor.css"></head>
<body>
<header id="chrome">
<span class="appname">Guest identities</span><span id="release" class="release" hidden></span><div id="metrics" class="metrics" aria-live="polite">Loading queue…</div>
<span id="identity" class="muted"></span></header>
<div id="notice" role="status" hidden></div>
<main id="workspace">
<aside class="pane queue"><header class="panehead"><h2>Review queue</h2><button id="refresh" class="icon-button" aria-label="Refresh" title="Refresh"><!-- Lucide refresh-cw; see lucide-LICENSE.txt --><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button></header>
<label class="queue-search"><span class="sr-only">Search names</span><input id="search" type="search" maxlength="100" placeholder="Search names" autocomplete="off"></label>
<div class="lean-filter" role="radiogroup" aria-label="Filter by likely outcome"><button role="radio" data-lean="all" aria-checked="true">All<span data-lean-count="all"></span></button><button role="radio" data-lean="same" aria-checked="false" title="No conflicting evidence and every review pair scored 95% or higher">Same guest<span data-lean-count="same"></span></button><button role="radio" data-lean="different" aria-checked="false" title="Conflicting evidence such as different personal emails or birth dates; strongest first">Different<span data-lean-count="different"></span></button></div>
<div class="queue-tools"><select id="status" aria-label="Case status"><option value="REVIEW">Needs review</option><option value="DEFERRED">Deferred</option><option value="RESOLVED">Resolved</option></select>
<select id="sort" aria-label="Sort cases"><option value="oldest">Oldest first</option><option value="confidence">Highest score</option></select></div>
<div id="queue-list" class="scroll" aria-live="polite"></div><footer class="paging"><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></footer></aside>
<div class="divider" id="resize-queue" role="separator" tabindex="0" aria-label="Resize queue and agent" aria-orientation="vertical"></div>
<section class="pane agent"><header class="panehead"><h2>Review agent</h2><span id="agent-state" class="muted"></span></header>
<div id="conversation" class="scroll"><div class="empty">Select a case to review its evidence.</div></div>
<div id="proposal" hidden></div>
<div class="composer-area"><form id="chat"><label class="sr-only" for="message">Message review agent</label><textarea id="message" placeholder="Review this case…" rows="2" disabled></textarea>
<div class="composer-bottom"><select id="mode" aria-label="Review mode"><option value="confirm">Agent · confirm changes</option><option value="auto">Agent · auto-approve</option><option value="manual">Manual review</option></select><button id="send" class="primary" disabled>Send</button></div></form>
<p class="caption product-line" title="Unity AI Gateway falls back to GPT-5.5, then Claude Sonnet 5, if GPT-5.6 Sol is unavailable. Agent tools run as the app service principal."><img src="/assets/brand/unity-ai-gateway-icon-full-color.svg" alt="">GPT-5.6 Sol through Unity AI Gateway, with fallbacks. Verify AI recommendations.</p><p id="mode-note" class="caption"></p></div></section>
<div class="divider" id="resize-evidence" role="separator" tabindex="0" aria-label="Resize agent and source comparison" aria-orientation="vertical"></div>
<section class="pane evidence"><header class="panehead"><h2>Source comparison</h2></header>
<div id="evidence" class="scroll"><div class="empty">Source records and pair evidence appear here.</div></div>
<footer id="manual" hidden><div class="manual-heading"><h3>Manual decision</h3><span id="recommended" class="muted"></span></div>
<div class="manual-options"><button data-action="MERGE">Merge</button><button data-action="SEPARATE">Keep separate</button><button data-action="PARTITION">Split into groups</button><button data-action="DEFER">Defer</button></div>
<div id="partition" hidden></div><label for="rationale">Decision rationale</label><textarea id="rationale" rows="2" placeholder="Explain the evidence for this decision"></textarea><button id="preview-manual" disabled>Preview decision</button></footer></section>
</main><script type="module" src="/assets/app.js"></script></body></html>
